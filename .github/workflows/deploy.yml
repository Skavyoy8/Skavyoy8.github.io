name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Chaque lundi à 05:00 UTC : rafraîchit les repos GitHub affichés dans le Lab.
    - cron: '0 5 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Configurer Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build et export statique
        run: npm run build
        env:
          # Vide pour <user>.github.io, « /<repo> » pour un site de projet.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier l'artefact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v5
